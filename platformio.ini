; PadelSense — Perceptio 2.0 — board bring-up firmware
; Target: ESP32-S3-MINI-1-N4R2 (4 MB flash, 2 MB quad PSRAM), ESP-IDF via PlatformIO
[env:perceptio2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = partitions.csv
; USB-Serial-JTAG on IO19/IO20 (pogo D±): esptool auto-detects the port, no reset button needed
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
extra_scripts = pre:tools/gzip_web.py
build_flags =
    -DPERCEPTIO_HW_REV=20
